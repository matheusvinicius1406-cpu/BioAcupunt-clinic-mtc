[project]
name = "bioacupunt-backend"
version = "0.1.0"
description = "BioAcupunt clinic backend — auth, clinics, patients, appointments, LGPD audit"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "python-jose[cryptography]>=3.3",
    "argon2-cffi>=23.1",
    "slowapi>=0.1.9",
    "greenlet>=3.0",
]

# Vercel-specific configuration — tells the Python builder where to find the
# FastAPI `app` instance. Declared here (root pyproject.toml) because Vercel's
# builder reads this file first, not backend/pyproject.toml.
[tool.vercel]
entrypoint = "backend.app.main:app"
